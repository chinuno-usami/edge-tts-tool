[package]
name = "edge-tts-tool"
version = "0.1.0"
edition = "2021"
authors = ["tts"]
description = "Desktop Edge-TTS tool with output device selection and global hotkey"

[dependencies]
# GUI
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "wgpu"] }
egui = "0.29"

# Audio & Device selection
rodio = "0.19"
cpal = "0.15"

# File Dialog & Clipboard
rfd = "0.15"
arboard = "3.4"

# Edge-TTS networking & async runtime
tokio = { version = "1.38", features = ["full"] }
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "default-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
uuid = { version = "1.8", features = ["v4"] }
chrono = "0.4"

# Global Hotkeys
global-hotkey = "0.6"

# Utility
directories = "5.0"
crossbeam-channel = "0.5"
log = "0.4"
env_logger = "0.11"
